<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title
        th:text="${resume.brief != null and resume.brief.userName != null ? resume.brief.userName + '的个人简历' : '个人简历'}">
        个人简历</title>
    <style>
        @page {
            size: A4;
            margin: 0;
        }

        @font-face {
            font-family: "Alibaba PuHuiTi";
            src: url("AlibabaPuHuiTi-Regular.otf");
            font-weight: 400;
        }

        @font-face {
            font-family: "Alibaba PuHuiTi";
            src: url("AlibabaPuHuiTi-Bold.otf");
            font-weight: 700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Alibaba PuHuiTi", "PingFang SC", sans-serif;
            background: #ffffff;
            color: #4f5966;
        }

        .page {
            width: 595px;
            min-height: 842px;
            margin: 0 auto;
            padding: 30px 30px 24px;
            background: #ffffff;
        }

        .top {
            overflow: hidden;
            margin-bottom: 18px;
        }

        .avatar-box {
            float: left;
            width: 136px;
            height: 136px;
            border: 4px solid #4e9cf7;
            background-color: #eef6ff;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        .hero {
            float: right;
            width: 380px;
        }

        .hero-head {
            overflow: hidden;
            margin-bottom: 14px;
        }

        .hero-name {
            float: left;
            font-size: 24px;
            line-height: 1.3;
            font-weight: 700;
            color: #353535;
        }

        .hero-title {
            float: right;
            font-size: 18px;
            line-height: 1.3;
            font-weight: 700;
            color: #357dda;
        }

        .hero-info {
            padding: 16px 18px;
            background: #d7ecff;
        }

        .info-line {
            margin-bottom: 4px;
            font-size: 12px;
            line-height: 1.8;
        }

        .info-item {
            display: inline-block;
            vertical-align: top;
            width: 164px;
        }

        .section {
            margin-bottom: 14px;
        }

        .section-head {
            position: relative;
            height: 34px;
            margin-bottom: 8px;
            page-break-after: avoid;
        }

        .section-line {
            position: absolute;
            left: 0;
            top: 15px;
            width: 100%;
            height: 4px;
            background: #d7ecff;
        }

        .section-tag {
            position: relative;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 4px;
            background: #3c8ee8;
            color: #ffffff;
            font-size: 16px;
            line-height: 1.2;
            font-weight: 700;
        }

        .row-item {
            margin-bottom: 10px;
            page-break-inside: avoid;
        }

        .row-head {
            overflow: hidden;
            margin-bottom: 4px;
            font-size: 12px;
            line-height: 1.6;
            color: #59616c;
            font-weight: 700;
        }

        .date {
            float: left;
            width: 122px;
        }

        .main {
            float: left;
            width: 310px;
        }

        .side {
            float: right;
            width: 94px;
            text-align: right;
        }

        .copy {
            font-size: 11px;
            line-height: 1.75;
            color: #67707b;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-break: loose;
            white-space: pre-line;
        }

        .footer-two {
            overflow: hidden;
            margin-top: 10px;
        }

        .footer-col {
            float: left;
            width: 250px;
        }

        .footer-right {
            float: right;
            width: 250px;
        }

        .plain {
            font-size: 11px;
            line-height: 1.8;
            color: #67707b;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-break: loose;
            white-space: pre-line;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body th:with="primaryEdu=${not #lists.isEmpty(resume.eduExperience) ? resume.eduExperience[0] : null}">
    <div class="page">
        <div class="top">
            <div class="avatar-box"
                th:style="${avatarUrl != null and avatarUrl != ''} ? 'background-image:url(' + avatarUrl + ');' : ''">
            </div>
            <div class="hero">
                <div class="hero-head">
                    <div class="hero-name"
                        th:text="${resume.brief != null and resume.brief.userName != null ? resume.brief.userName : '昵称'}">
                        昵称</div>
                    <div class="hero-title">求职意向 | --</div>
                </div>
                <div class="hero-info">
                    <div class="info-line">
                        <span class="info-item">学历 | <span
                                th:text="${primaryEdu != null and primaryEdu.degree != null ? primaryEdu.degree : '未填写'}">硕士</span></span>
                        <span class="info-item">籍贯 | <span
                                th:if="${resume.base == null || resume.base.isEmpty()}">未填写</span><span
                                th:each="item : ${resume.base}" th:text="${item}"
                                style="margin-right:4px;">广东深圳市</span></span>
                    </div>
                    <div class="info-line">
                        <span class="info-item">电话 | <span
                                th:text="${resume.tele != null ? resume.tele : '未填写'}">000-0000-0000</span></span>
                        <span class="info-item">QQ | <span>未填写</span></span>
                    </div>
                    <div class="info-line">
                        <span class="info-item">邮箱 | <span
                                th:text="${resume.email != null ? resume.email : '未填写'}">xxxxxx@xxx.com</span></span>
                        <span class="info-item">微信 | <span
                                th:text="${resume.vxNo != null ? resume.vxNo : '未填写'}">xxxxx</span></span>
                    </div>
                </div>
            </div>
            <div class="clear"></div>
        </div>

        <div class="section" th:if="${not #lists.isEmpty(resume.eduExperience)}">
        <div class="section-head"><div class="section-line"></div><span class="section-tag">教育背景</span></div>
            <div class="row-item" th:each="edu : ${resume.eduExperience}">
                <div class="row-head">
                    <div class="date"
                        th:text="${(edu.startDate != null ? edu.startDate : '未填写') + '—' + (edu.endDate != null ? edu.endDate : '至今')}">
                        2023.09至今</div>
                    <div class="main"
                        th:text="${(edu.name != null ? edu.name : '未填写学校名称') + ' / ' + (edu.label != null ? edu.label : '未填写专业')}">
                        XX大学 / 计算机软件</div>
                    <div class="side" th:text="${edu.degree != null ? edu.degree : '未填写'}">全日制本科</div>
                </div>
                <div class="copy" th:text="${edu.content != null ? edu.content : '未填写项目内容'}">教育内容</div>
            </div>
        </div>

        <div class="section" th:if="${resume.extraInfo != null}">
        <div class="section-head"><div class="section-line"></div><span class="section-tag">附加信息</span></div>
            <div class="plain" th:text="${resume.extraInfo}">附加信息内容</div>
        </div>

        <div class="section" th:if="${not #lists.isEmpty(resume.schoolExperience)}">
        <div class="section-head"><div class="section-line"></div><span class="section-tag">在校经历</span></div>
            <div class="row-item" th:each="school : ${resume.schoolExperience}">
                <div class="row-head">
                    <div class="date"
                        th:text="${(school.startDate != null ? school.startDate : '未填写') + '—' + (school.endDate != null ? school.endDate : '至今')}">
                        2021.09-2022.06</div>
                    <div class="main"
                        th:text="${(school.name != null ? school.name : '未填写项目名称') + '  ' + (school.label != null ? school.label : '项目说明')}">
                        XX大学学生会 宣传部</div>
                    <div class="side"></div>
                </div>
                <div class="copy" th:text="${school.content != null ? school.content : '未填写项目内容'}">在校经历内容</div>
            </div>
        </div>

        <div class="section" th:if="${not #lists.isEmpty(resume.projectExperience)}">
        <div class="section-head"><div class="section-line"></div><span class="section-tag">项目经历</span></div>
            <div class="row-item" th:each="project : ${resume.projectExperience}">
                <div class="row-head">
                    <div class="date"
                        th:text="${(project.startDate != null ? project.startDate : '未填写') + '—' + (project.endDate != null ? project.endDate : '至今')}">
                        2020.09-2021.06</div>
                    <div class="main"
                        th:text="${(project.name != null ? project.name : '未填写项目名称') + '  ' + (project.label != null ? project.label : '项目说明')}">
                        校园项目 系统开发</div>
                    <div class="side"></div>
                </div>
                <div class="copy" th:text="${project.content != null ? project.content : '未填写项目内容'}">项目内容</div>
            </div>
        </div>

        <div class="section" th:if="${not #lists.isEmpty(resume.workExperience)}">
        <div class="section-head"><div class="section-line"></div><span class="section-tag">工作经历</span></div>
            <div class="row-item" th:each="work : ${resume.workExperience}">
                <div class="row-head">
                    <div class="date"
                        th:text="${(work.startDate != null ? work.startDate : '未填写') + '—' + (work.endDate != null ? work.endDate : '至今')}">
                        2020.03-2022.02</div>
                    <div class="main"
                        th:text="${(work.name != null ? work.name : '未填写公司/机构名称') + ' / ' + (work.label != null ? work.label : '未填写职位')}">
                        XX有限公司 / 软件开发工程师</div>
                    <div class="side"></div>
                </div>
                <div class="copy" th:text="${work.content != null ? work.content : '未填写工作内容'}">工作内容</div>
            </div>
        </div>

        <div class="footer-two">
            <div class="footer-col section"
                th:if="${resume.brief != null and resume.brief.skills != null and !resume.brief.skills.isEmpty()}">
                <div class="section-head"><div class="section-line"></div><span class="section-tag">职业技能</span></div>
                <div class="plain" th:text="${resume.brief.skills}">技能内容</div>
            </div>

            <div class="footer-right section"
                th:if="${resume.brief != null and resume.brief.userBrief != null and !resume.brief.userBrief.isEmpty()}">
                <div class="section-head"><div class="section-line"></div><span class="section-tag">个人优势</span></div>
                <div class="plain" th:text="${resume.brief.userBrief}">优势内容</div>
            </div>
            <div class="clear"></div>
        </div>
    </div>
</body>

</html>
